
# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  azd: '>=1.27.1'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.9'

name: langgraph-custom-host-responses

services:
  ai-project:
    host: azure.ai.project
    deployments: []
    endpoint: https://fraud-demo.services.ai.azure.com/api/projects/proj-demo

  langgraph-custom-host-responses:
    project: src/langgraph-custom-host-responses
    host: azure.ai.agent
    image: demoacr1111.azurecr.io/mortgage-credit-memo-poc:pdf-fix-20261017
    docker:
      imagePassthrough: true
    language: docker
    uses:
      - ai-project
    env:
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT}
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      AZURE_SEARCH_ENDPOINT: https://aisearchdemo131233b.search.windows.net
      AZURE_SEARCH_INDEX_NAME: mortgage-document-evidence
    container:
      resources:
        cpu: "0.5"
        memory: 1Gi
    description: Mortgage document validation and credit memo generation agent
    displayName: Mortgage Credit Memo POC
    kind: hosted
    metadata:
      tags:
        - AI Agent Hosting
        - Responses Protocol
        - LangGraph
        - LangChain
        - Python
    name: langgraph-custom-host-responses
    protocols:
      - protocol: responses
        version: 2.0.0

infra:
  provider: microsoft.foundry
